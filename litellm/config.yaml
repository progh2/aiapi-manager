# 학생에게 노출할 모델 목록.
# model_name은 학생이 요청에 쓰는 이름, litellm_params.model이 실제 백엔드 모델.
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  # 학생 키 metadata.aiapi_schedule 밖 호출을 거절한다.
  callbacks: aiapi_policy.proxy_handler_instance

# 묶음은 같은 model_name 배포의 weight 로 나눈다. simple-shuffle 이 그 weight 를 읽는다.
# 시간 초과, 429, 5xx 는 같은 이름의 다른 배포로 한 번 더 시도한다.
# 인증 실패와 잘못된 요청은 다른 키로 넘기지 않는다.
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  allowed_fails: 1
  cooldown_time: 30
  retry_policy:
    TimeoutErrorRetries: 1
    RateLimitErrorRetries: 1
    InternalServerErrorRetries: 1
    ServiceUnavailableErrorRetries: 1
    AuthenticationErrorRetries: 0
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    NotFoundErrorRetries: 0
    DefaultRetries: 0
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 0
    AuthenticationErrorAllowedFails: 0
    TimeoutErrorAllowedFails: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # 관리 화면에서 추가한 모델이 재시작 후에도 남는다.
  store_model_in_db: true
