<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AIAPI 관제 함교 — 수업용 AI API 관리</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%235fdcff'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%235fdcff' stroke-width='2' transform='rotate(-25 16 16)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/bridge.css">
  <link rel="stylesheet" href="/css/elfy.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 48 48"><circle cx="24" cy="24" r="6.5" fill="currentColor"/><ellipse cx="24" cy="24" rx="20" ry="8" fill="none" stroke="currentColor" stroke-width="2.2" transform="rotate(-24 24 24)"/><ellipse cx="24" cy="24" rx="20" ry="8" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55" transform="rotate(36 24 24)"/><circle cx="40" cy="15" r="2.6" fill="currentColor"/></symbol>

      <symbol id="i-keys" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/></symbol>
      <symbol id="i-classes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-20 12 12)"/><circle cx="20" cy="8.5" r="1.3" fill="currentColor"/></symbol>
      <symbol id="i-launch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4c3.5 0 6 2.5 6 6-2 4-5.5 6.5-9 8l-5-5c1.5-3.5 4-7 8-9z"/><circle cx="14.5" cy="9.5" r="1.8"/><path d="M6 13l-2.5 1 2 5 5-2 1-2.5M4 20l3-3"/></symbol>
      <symbol id="i-engine" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M13 8.5l-3 4h4l-3 4"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></symbol>
      <symbol id="i-crew" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.3"/><path d="M5.5 16.5c.8-1.7 2-2.5 3.5-2.5s2.7.8 3.5 2.5M15 10h3.5M15 13.5h3.5"/></symbol>
      <symbol id="i-log" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></symbol>
      <symbol id="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5M4 13a8 8 0 0 0 14.5 4.5"/><path d="M5 3v4h4M19 21v-4h-4"/></symbol>
      <symbol id="i-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-cmd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
      <symbol id="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5M20 4v4.5h-4.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-print" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-ban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/></symbol>
      <symbol id="i-coin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.6 0-2.7.9-2.7 2s1 1.6 2.7 2c1.8.4 2.8 1 2.8 2.1s-1.2 2-2.8 2c-1.2 0-2.2-.5-2.7-1.4M12 6.5V8M12 16v1.5"/></symbol>
      <symbol id="i-cycle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/><circle cx="12" cy="12" r="2.2"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
      <symbol id="i-elfy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/><path d="M5 16.5c1 1.8 2.7 3 4.8 3.4"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></symbol>
    </defs>
  </svg>

  <canvas id="scene" aria-hidden="true" tabindex="-1"></canvas>
  <div id="starfield" aria-hidden="true"></div>
  <div id="scene-labels" aria-hidden="true"></div>
  <div id="veil" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-box">
      <div class="boot-logo">
        <svg style="color:var(--hud)"><use href="#i-logo"/></svg>
        <div><div class="n">AIAPI</div><div class="s">수업용 AI API 관제 함교</div></div>
      </div>
      <div class="boot-lines" id="boot-lines"></div>
      <div class="boot-bar"><i id="boot-bar"></i></div>
    </div>
  </div>

  <section id="login" class="login" hidden>
    <div class="panel login-card">
      <div class="holo">
        <div class="holo-fig"><img src="/mascot/holo/elf-welcome.webp" alt=""></div>
      </div>
      <h1>AIAPI</h1>
      <p>수업용 AI API 관제 함교 · 등록된 구글 계정으로 들어오세요</p>
      <button class="btn primary" id="login-btn" type="button">Google 계정으로 승선</button>
      <div class="login-error" id="login-error" role="alert"></div>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <header class="hud">
      <div class="brand" title="AIAPI 관제 함교">
        <svg class="brand-mark" style="color:var(--hud)"><use href="#i-logo"/></svg>
        <span class="brand-name">AIAPI</span>
      </div>
      <div class="hud-title"><span class="code" id="hud-code">STATION 01 · BRIDGE</span><span class="name" id="hud-name">개요</span></div>
      <div class="hud-spacer"></div>
      <button class="condition" id="hud-condition" type="button" data-level="green" title="경보 목록 보기"><span class="led good" id="hud-condition-led"></span><span class="cc" id="hud-condition-code">CONDITION GREEN</span><span id="hud-condition-text">이상 없음</span></button>
      <div class="lights" id="hud-lights"></div>
      <div class="clock"><div class="t num" id="hud-clock">--:--:--</div><div class="d" id="hud-date"></div></div>
      <div class="hud-actions">
        <button class="icon-btn" id="btn-cmd" type="button" title="명령 팔레트 (Ctrl+K)"><svg><use href="#i-cmd"/></svg></button>
        <button class="icon-btn" id="btn-auto" type="button" aria-pressed="false" title="관제 모드 — 화면 자동 순환 (A)"><svg><use href="#i-cycle"/></svg></button>
        <button class="icon-btn" id="btn-3d" type="button" aria-pressed="true" title="3D 관제도 켜기/끄기"><svg><use href="#i-cube"/></svg></button>
        <button class="icon-btn" id="btn-sound" type="button" aria-pressed="true" title="효과음 켜기/끄기 (M)"><svg><use href="#i-volume"/></svg></button>
        <button class="icon-btn" id="btn-full" type="button" title="전체 화면 (F)"><svg><use href="#i-full"/></svg></button>
        <button class="icon-btn" id="btn-settings" type="button" title="설정"><svg><use href="#i-gear"/></svg></button>
        <button class="icon-btn" id="btn-help" type="button" title="단축키 (?)"><svg><use href="#i-help"/></svg></button>
        <div class="who"><span class="em" id="hud-who"></span><button class="icon-btn" id="btn-logout" type="button" title="로그아웃"><svg><use href="#i-exit"/></svg></button></div>
      </div>
    </header>
    <nav class="rail" id="rail" aria-label="스테이션"></nav>
    <main class="stage" id="stage">
      <section class="station" id="st-bridge" data-station="bridge" aria-label="개요"></section>
      <section class="station" id="st-telemetry" data-station="telemetry" aria-label="사용량"></section>
      <section class="station" id="st-keys" data-station="keys" aria-label="키 관리"></section>
      <section class="station" id="st-classes" data-station="classes" aria-label="학급/조"></section>
      <section class="station" id="st-launch" data-station="launch" aria-label="키 발급"></section>
      <section class="station" id="st-engines" data-station="engines" aria-label="공급자"></section>
      <section class="station" id="st-crew" data-station="crew" aria-label="사용자"></section>
      <section class="station" id="st-log" data-station="log" aria-label="기록"></section>
      <section class="station" id="st-ai" data-station="ai" aria-label="AI 엘피"></section>
    </main>
    <footer class="foot" id="foot">
      <span class="lbl">COMMS</span>
      <div class="ticker" id="ticker" aria-label="최근 호출"><div class="ticker-track" id="ticker-track"><span class="tk muted">통신 대기 중…</span></div></div>
      <span class="auto-state" id="auto-state"></span>
    </footer>
  </div>

  <div id="pilot" class="app pilot" hidden></div>

  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="overlay-root"></div>
  <div id="print-root"></div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="roster.js"></script>
  <script src="key-revoke.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
