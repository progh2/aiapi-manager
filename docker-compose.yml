services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: aiapi-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 이미지에 curl이 없을 수 있어 python urllib 사용
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - aiapi-internal

  admin-ui:
    build: ./admin-ui
    container_name: aiapi-admin-ui
    restart: unless-stopped
    ports:
      - "${ADMIN_UI_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_BASE_URL: http://litellm:4000
      USERS_DATA_PATH: /app/data/users.json
    volumes:
      - ./admin-ui/data:/app/data
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      # node:20 내장 fetch. alpine에 wget/curl 없음
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - aiapi-internal

  db:
    image: postgres:16-alpine
    container_name: aiapi-postgres
    restart: unless-stopped
    # 외부 포트를 열지 않음 — litellm 컨테이너에서만 내부 네트워크로 접근
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aiapi-internal

networks:
  aiapi-internal:
    driver: bridge
